<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="PS4 VenomX logo">
  <defs>
    <linearGradient id="venom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff88"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ffe2"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="44%" r="58%">
      <stop offset="0" stop-color="#2cff88" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="badge">
      <rect x="20" y="20" width="600" height="600" rx="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect x="20" y="20" width="600" height="600" fill="#07070c"/>
    <rect x="20" y="20" width="600" height="600" fill="url(#aura)"/>

    <!-- symbiote tendrils -->
    <g fill="none" stroke-linecap="round">
      <path d="M78 556 C122 512 84 458 130 418 C160 392 140 346 170 318" stroke="#0b0b12" stroke-width="38"/>
      <path d="M78 556 C122 512 84 458 130 418 C160 392 140 346 170 318" stroke="url(#venom)" stroke-width="8" opacity="0.95"/>
      <path d="M56 478 C100 450 84 406 120 380 C146 360 140 326 160 302" stroke="#0b0b12" stroke-width="26"/>
      <path d="M56 478 C100 450 84 406 120 380 C146 360 140 326 160 302" stroke="url(#venom)" stroke-width="6" opacity="0.8"/>
      <path d="M100 602 C142 566 112 522 150 494" stroke="#0b0b12" stroke-width="30"/>
      <path d="M100 602 C142 566 112 522 150 494" stroke="url(#venom)" stroke-width="7" opacity="0.85"/>
    </g>
    <g fill="none" stroke-linecap="round" transform="translate(640,0) scale(-1,1)">
      <path d="M78 556 C122 512 84 458 130 418 C160 392 140 346 170 318" stroke="#0b0b12" stroke-width="38"/>
      <path d="M78 556 C122 512 84 458 130 418 C160 392 140 346 170 318" stroke="url(#venom)" stroke-width="8" opacity="0.95"/>
      <path d="M56 478 C100 450 84 406 120 380 C146 360 140 326 160 302" stroke="#0b0b12" stroke-width="26"/>
      <path d="M56 478 C100 450 84 406 120 380 C146 360 140 326 160 302" stroke="url(#venom)" stroke-width="6" opacity="0.8"/>
      <path d="M100 602 C142 566 112 522 150 494" stroke="#0b0b12" stroke-width="30"/>
      <path d="M100 602 C142 566 112 522 150 494" stroke="url(#venom)" stroke-width="7" opacity="0.85"/>
    </g>

    <!-- symbiote spider -->
    <g>
      <ellipse cx="320" cy="130" rx="26" ry="34" fill="#39ff88" opacity="0.22" filter="url(#glow)"/>
      <g fill="none" stroke="#eefff5" stroke-width="6" stroke-linecap="round" opacity="0.95">
        <path d="M305 108 C278 88 260 96 242 76"/>
        <path d="M302 122 C272 114 256 126 234 116"/>
        <path d="M302 136 C274 142 262 158 238 160"/>
        <path d="M306 150 C284 166 280 182 262 192"/>
        <path d="M335 108 C362 88 380 96 398 76"/>
        <path d="M338 122 C368 114 384 126 406 116"/>
        <path d="M338 136 C366 142 378 158 402 160"/>
        <path d="M334 150 C356 166 360 182 378 192"/>
      </g>
      <ellipse cx="320" cy="126" rx="15" ry="23" fill="#f4fff8"/>
      <circle cx="320" cy="96" r="10" fill="#f4fff8"/>
    </g>

    <!-- wordmark -->
    <text x="320" y="342" text-anchor="middle"
          font-family="Impact, 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="160" font-weight="900" letter-spacing="2"
          fill="url(#wordmark)" stroke="#0a0a10" stroke-width="2">PS4</text>

    <text x="320" y="476" text-anchor="middle"
          font-family="Impact, 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="104" font-weight="900" letter-spacing="9"
          fill="#39ff88" opacity="0.55" filter="url(#glow)">VENOMX</text>
    <text x="320" y="476" text-anchor="middle"
          font-family="Impact, 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="104" font-weight="900" letter-spacing="9"
          fill="url(#venom)" stroke="#08080d" stroke-width="2">VENOMX</text>

    <!-- venom drip -->
    <path d="M176 502 H464" stroke="url(#venom)" stroke-width="5" stroke-linecap="round"/>
    <path d="M292 502 C292 520 283 528 292 544 C301 528 292 520 292 502 Z" fill="url(#venom)"/>
    <path d="M352 502 C352 514 346 520 352 530 C358 520 352 514 352 502 Z" fill="url(#venom)"/>

    <!-- PlayStation symbols -->
    <g transform="translate(240,566)" opacity="0.95">
      <path d="M18 2 L34 32 H2 Z" fill="none" stroke="#39ff88" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <g transform="translate(304,566)">
      <circle cx="18" cy="18" r="15" fill="none" stroke="#f4fff8" stroke-width="4"/>
    </g>
    <g transform="translate(368,566)">
      <path d="M6 6 L30 30 M30 6 L6 30" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(432,566)">
      <rect x="4" y="4" width="28" height="28" rx="2" fill="none" stroke="#a855f7" stroke-width="4"/>
    </g>
  </g>

  <rect x="28" y="28" width="584" height="584" rx="96" fill="none" stroke="url(#venom)" stroke-width="3" opacity="0.85"/>
</svg>
